<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartMirror AR</title>
  <!-- PWA : carte d'identité de l'application + couleur de la barre de titre -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Propriétaire : Eya (structure de l'interface) -->
  <header>
    <h1>SmartMirror AR</h1>
    <span id="offline-badge" class="badge-offline" role="status" hidden>Hors ligne</span>
    <span id="status" class="status">Chargement…</span>
  </header>

  <main>
    <section id="intro" class="panel">
      <p>Placez-vous de face, à environ 1,5–2 m, épaules et hanches visibles, avec un bon éclairage.</p>
      <button id="btn-start" disabled>Démarrer l'essayage</button>
    </section>

    <section id="stage" hidden>
      <video id="video" playsinline muted></video>
      <canvas id="render-canvas"></canvas>   <!-- Tasnim : rendu WebGPU -->
      <canvas id="diag-canvas"></canvas>     <!-- Eya : mode diagnostic -->
      <p id="hint" class="hint"></p>
    </section>

    <aside id="controls" hidden>
      <h2>Catalogue</h2>
      <div id="catalog"></div>
      <h2>Couleur</h2>
      <div id="colors"></div>
      <h2>Réglages</h2>
      <label>Taille <input id="adj-scale" type="range" min="0.7" max="1.3" step="0.01" value="1" /></label>
      <label>Décalage X <input id="adj-x" type="range" min="-0.3" max="0.3" step="0.01" value="0" /></label>
      <label>Décalage Y <input id="adj-y" type="range" min="-0.3" max="0.3" step="0.01" value="0" /></label>
      <button id="btn-reset">Réinitialiser</button>
      <label><input id="chk-diag" type="checkbox" /> Mode diagnostic</label>
      <button id="btn-stop">Arrêter</button>
      <pre id="stats"></pre>
    </aside>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
