<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartMirror AR</title>
  <!-- PWA : carte d'identité de l'application + couleur de la barre de titre -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FDFCFB" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Propriétaire : Eya (structure de l'interface) -->
  <header>
    <a href="/src/pages/home.html" class="btn-back">← Catalogue</a>
    <h1>SmartMirror AR</h1>
    <span id="offline-badge" class="badge-offline" role="status" hidden>Hors ligne</span>
    <span id="status" class="status">Chargement…</span>
  </header>

  <main>
    <section id="intro" class="panel">
      <p>Placez-vous de face, à environ 1,5–2 m, épaules et hanches visibles, avec un bon éclairage.</p>
      <button id="btn-start" disabled>Démarrer l'essayage</button>
    </section>

    <section id="stage" hidden>
      <video id="video" playsinline muted></video>
      <canvas id="render-canvas"></canvas>   <!-- Tasnim : rendu WebGPU -->
      <canvas id="diag-canvas"></canvas>     <!-- Eya : mode diagnostic -->
      <p id="hint" class="hint"></p>
      <p id="placement" class="placement" role="status" aria-live="polite" hidden></p> <!-- Salma : « Placez-vous », 3-2-1 -->

    </section>

    <aside id="controls" hidden>
      <h2>Catalogue</h2>
      <div id="catalog"></div>
      <h2>Couleur</h2>
      <div id="colors"></div>
      <h2>Réglages</h2>
      <label>Taille <input id="adj-scale" type="range" min="0.7" max="1.3" step="0.01" value="1" /> <output id="adj-scale-val">100 %</output></label>
      <label>Décalage X <input id="adj-x" type="range" min="-0.3" max="0.3" step="0.01" value="0" /> <output id="adj-x-val">0 %</output></label>
      <label>Décalage Y <input id="adj-y" type="range" min="-0.3" max="0.3" step="0.01" value="0" /> <output id="adj-y-val">0 %</output></label>
      <button id="btn-reset">Réinitialiser</button>
      <label><input id="chk-diag" type="checkbox" /> Mode diagnostic</label>
      <fieldset id="calibration" hidden>
        <legend>Calibration du vêtement</legend>
        <label>ks (épaules) <input id="cal-ks" type="range" min="1" max="2" step="0.01" /> <output id="cal-ks-val"></output></label>
        <label>kh (hanches) <input id="cal-kh" type="range" min="1" max="2" step="0.01" /> <output id="cal-kh-val"></output></label>
        <label>dc (encolure) <input id="cal-dc" type="range" min="0" max="0.4" step="0.01" /> <output id="cal-dc-val"></output></label>
        <label>db (bas) <input id="cal-db" type="range" min="0" max="0.5" step="0.01" /> <output id="cal-db-val"></output></label>
        <button id="cal-copy" type="button">Copier le fit</button>
      </fieldset>
      <fieldset id="measures" hidden>
        <legend>Mesure de stabilité (F04)</legend>
        <small>Restez immobile pendant l'enregistrement.</small>
        <button id="btn-record" type="button">Enregistrer</button>
        <button id="btn-export" type="button" disabled>Exporter (JSON)</button>
        <output id="record-result"></output>
      </fieldset>
      <button id="btn-stop">Arrêter</button>
      <pre id="stats"></pre>
    </aside>
  </main>

  <script type="module" src="/src/main.mjs"></script>
</body>
</html>
