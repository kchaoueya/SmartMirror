name: CI / CD

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # ── CI : vérification à chaque push ──────────────────────────────────
  ci:
    name: Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Vérifier le build
        run: npm run build

      # Sauvegarde du dossier dist/ pour le job deploy (uniquement sur main)
      - name: Sauvegarder dist/
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── CD : déploiement sur Netlify (uniquement sur main) ───────────────
  deploy:
    name: Déploiement Netlify
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Déployer sur Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: dist/
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
