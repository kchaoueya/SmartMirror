<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Test skinning — SmartMirror AR</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { display: flex; gap: 1rem; padding: 1rem; }
    #stage { position: relative; flex: 1; aspect-ratio: 4 / 3; max-height: 85vh; background: #000; overflow: hidden; }
    #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #stage video { object-fit: cover; transform: scaleX(-1); } /* identique à src/style.css */
    #overlay { pointer-events: none; }
    aside { width: 19rem; display: flex; flex-direction: column; gap: .5rem; }
    pre { font-size: .8rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <!-- Page de test de Salma : skinning 2D des manches (LBS), sans le reste de l'application. -->
  <main>
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="render"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <aside>
      <h2>Test skinning des manches</h2>
      <label>Vêtement <select id="garment"></select></label>
      <label>Fiabilité minimale des bras <input id="thr" type="range" min="0" max="1" step="0.05" value="0.5" /> <span id="thr-val">0.5</span></label>
      <label><input id="off" type="checkbox" /> Désactiver le skinning (homographie seule)</label>
      <label><input id="bones" type="checkbox" checked /> Afficher le squelette</label>
      <small>Squelette : vert/rouge = repères MediaPipe lissés (fiable / non) ; jaune pointillé = os du vêtement
        au repos, ramenés à l'écran par l'homographie du buste.</small>
      <button id="start">Démarrer</button>
      <button id="stop">Arrêter</button>
      <pre id="stats">—</pre>
    </aside>
  </main>
  <script type="module" src="./skin-test.mjs"></script>
</body>
</html>
