<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Éditeur de squelette — SmartMirror AR</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { display: flex; gap: 1rem; padding: 1rem; }
    #wrap { flex: 1; display: flex; justify-content: center; }
    canvas { max-width: 100%; max-height: 88vh; background: repeating-conic-gradient(#2a2a2a 0 25%, #333 0 50%) 0 0 / 24px 24px; cursor: crosshair; }
    aside { width: 20rem; display: flex; flex-direction: column; gap: .5rem; }
    textarea { width: 100%; height: 14rem; font: .75rem monospace; background: #1b1b1b; color: #eee; }
    .legend span { display: inline-block; width: .8rem; height: .8rem; margin-right: .3rem; vertical-align: middle; }
  </style>
</head>
<body>
  <!-- Outil de Salma : placer les 8 articulations du squelette au repos d'un vêtement du catalogue. -->
  <main>
    <div id="wrap"><canvas id="view"></canvas></div>
    <aside>
      <h2>Squelette du vêtement</h2>
      <label>Vêtement <select id="garment"></select></label>
      <label><input id="weights" type="checkbox" checked /> Afficher les poids (os dominant)</label>
      <div class="legend">
        <span style="background:#9ca3af"></span>buste
        <span style="background:#60a5fa"></span>bras G
        <span style="background:#1d4ed8"></span>avant-bras G
        <span style="background:#f472b6"></span>bras D
        <span style="background:#be185d"></span>avant-bras D
      </div>
      <small>Glisser un point pour le déplacer. Épaules et hanches = articulations (repères MediaPipe), pas les
        coutures. Coudes et poignets : là où seraient ceux d'une personne portant le vêtement à plat.</small>
      <button id="reset">Revenir au squelette par défaut</button>
      <button id="copy">Copier le JSON « skeleton »</button>
      <textarea id="json" readonly></textarea>
      <small id="msg"></small>
    </aside>
  </main>
  <script type="module" src="./skeleton-editor.mjs"></script>
</body>
</html>
