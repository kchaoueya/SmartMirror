<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Test vision — SmartMirror AR</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { display: flex; gap: 1rem; padding: 1rem; }
    #stage { position: relative; flex: 1; aspect-ratio: 4 / 3; max-height: 85vh; background: #000; overflow: hidden; }
    #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #stage video { object-fit: cover; transform: scaleX(-1); } /* identique à src/style.css */
    aside { width: 18rem; display: flex; flex-direction: column; gap: .5rem; }
    pre { font-size: .8rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <!-- Page de test de Salma : caméra + MediaPipe + conversion des coordonnées, sans le reste de l'application. -->
  <main>
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <aside>
      <h2>Test vision (S2)</h2>
      <label>Caméra <select id="camera"></select></label>
      <label>Modèle
        <select id="model">
          <option value="lite">lite (rapide)</option>
          <option value="full">full</option>
          <option value="heavy">heavy (précis)</option>
        </select>
      </label>
      <label>Inférences / s <input id="rate" type="range" min="5" max="30" value="15" /> <span id="rate-val">15</span></label>
      <label>Seuil de visibilité <input id="thr" type="range" min="0" max="1" step="0.05" value="0.5" /> <span id="thr-val">0.5</span></label>
      <label><input id="flow" type="checkbox" checked /> Flux optique entre deux inférences (S4)</label>
      <small>Vert/rouge : détection MediaPipe · bleu : flux optique · orange : repère rejeté, replacé avec le buste.
        Baisser les inférences à 5/s rend la différence visible.</small>
      <button id="start">Démarrer</button>
      <button id="stop">Arrêter</button>
      <pre id="stats">—</pre>
    </aside>
  </main>
  <script type="module" src="./pose-test.js"></script>
</body>
</html>
